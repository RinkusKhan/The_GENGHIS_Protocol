  <text x="500" y="42" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="700">The GENGHIS Ecosystem</text>
  <text x="500" y="66" text-anchor="middle" fill="#94a3b8" font-size="14">One coordinator — memory and compute pooled from hardware you already own</text>

  <!-- coordinator hub -->
  <rect x="418" y="86" width="164" height="46" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5"/>
