  <text x="470" y="120" fill="#7dd3fc" font-size="10.5">Coordinator</text>
  <text x="500" y="152" text-anchor="middle" fill="#64748b" font-size="11">any box can lend memory, so a model too big for one device still runs · speed comes from GPUs on fast wired links</text>

