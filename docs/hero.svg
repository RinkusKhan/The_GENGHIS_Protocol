<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="1200" height="340" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- ===================== EMBLEM (left) ===================== -->
  <g transform="translate(185,170)">
    <circle cx="0" cy="0" r="150" fill="url(#glow)"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 5"/>

    <!-- spokes -->
    <g stroke="#334155" stroke-width="1.5">
      <line x1="0" y1="0" x2="112" y2="0"/>
      <line x1="0" y1="0" x2="79" y2="-79"/>
      <line x1="0" y1="0" x2="0" y2="-112"/>
      <line x1="0" y1="0" x2="-79" y2="-79"/>
      <line x1="0" y1="0" x2="-112" y2="0"/>
      <line x1="0" y1="0" x2="-79" y2="79"/>
      <line x1="0" y1="0" x2="0" y2="112"/>
      <line x1="0" y1="0" x2="79" y2="79"/>
    </g>

    <!-- activation dots mid-spoke -->
    <g fill="#38bdf8">
      <circle cx="56" cy="0" r="2.4"/>
      <circle cx="0" cy="-56" r="2.4"/>
      <circle cx="-40" cy="40" r="2.4"/>
    </g>

    <!-- donor nodes (tier colors) -->
    <circle cx="112" cy="0" r="8" fill="#34d399"/>
    <circle cx="79" cy="-79" r="6" fill="#fbbf24"/>
    <circle cx="0" cy="-112" r="8" fill="#38bdf8"/>
    <circle cx="-79" cy="-79" r="6" fill="#a78bfa"/>
    <circle cx="-112" cy="0" r="7" fill="#fbbf24"/>
    <circle cx="-79" cy="79" r="6" fill="#34d399"/>
    <circle cx="0" cy="112" r="7" fill="#fbbf24"/>
    <circle cx="79" cy="79" r="6" fill="#a78bfa"/>

    <!-- coordinator hub -->
    <circle cx="0" cy="0" r="40" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="17" fill="none" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
  </g>

  <!-- ===================== WORDMARK (right) ===================== -->
  <text x="378" y="132" font-size="46" font-weight="800" letter-spacing="1.5">
    <tspan fill="url(#mark)">GENGHIS</tspan><tspan fill="#64748b" font-size="20" font-weight="600" dy="-18">™</tspan>
  </text>

  <!-- accent rule -->
  <rect x="380" y="150" width="150" height="3" rx="1.5" fill="url(#mark)"/>

  <text x="380" y="188" font-size="19" fill="#cbd5e1">One coordinator. Every idle device. One AI mind.</text>

  <!-- feature pills -->
  <g font-size="12" fill="#cbd5e1">
    <g><rect x="380" y="208" width="108" height="26" rx="13" fill="#111827" stroke="#334155"/><text x="434" y="225" text-anchor="middle">Layer-sharded</text></g>
    <g><rect x="500" y="208" width="96" height="26" rx="13" fill="#111827" stroke="#334155"/><text x="548" y="225" text-anchor="middle">Self-healing</text></g>
    <g><rect x="608" y="208" width="90" height="26" rx="13" fill="#111827" stroke="#334155"/><text x="653" y="225" text-anchor="middle">LAN-native</text></g>
    <g><rect x="710" y="208" width="152" height="26" rx="13" fill="#111827" stroke="#334155"/><text x="786" y="225" text-anchor="middle">Heterogeneous fleet</text></g>
    <g><rect x="874" y="208" width="96" height="26" rx="13" fill="#111827" stroke="#334155"/><text x="922" y="225" text-anchor="middle">Apache-2.0</text></g>
  </g>

  <text x="380" y="270" font-size="13.5" fill="#64748b">Pool memory &amp; compute across the hardware you already own — self-healing, self-balancing, coordinator-planned.</text>

  <!-- epigraph nod to the name -->
  <text x="380" y="298" font-size="12.5" font-style="italic" fill="#475569">“Each keeps its own tongue — united under one banner.”</text>
</svg>
